services:
  app:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgres://radpair:radpair@db:5432/radpair
      IMAGE_DIR: /app/images
    volumes:
      - study-images:/app/images
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: radpair
      POSTGRES_PASSWORD: radpair
      POSTGRES_DB: radpair
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U radpair -d radpair']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  study-images:
