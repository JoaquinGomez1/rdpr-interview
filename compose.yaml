services:
  app:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgres://radpair:radpair@db:5432/radpair

  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: radpair
      POSTGRES_PASSWORD: radpair
      POSTGRES_DB: radpair
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
